services:
  database_postgresql:
    image: postgres
    environment:
      POSTGRES_DB: 'ecmorelia_database'
      POSTGRES_USER: 'posgres'
      POSTGRES_PASSWORD: '1234'
    ports:
      - '5432:5432'
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
  backend-de-nodejs:
    build:
      context: ./ECMorelia-Back
      dockerfile: Dockerfile
    image: ecmorelia_backend_image
    ports:
      - '3000:3000'
  frontend-de-vite:
    build:
      context: ./ECMorelia-Front
      dockerfile: Dockerfile
    image: ecmorelia_frontend_image
    ports: 
      - '5173:5173'